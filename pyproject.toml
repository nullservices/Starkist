[project]
name = "starkist"
version = "0.2.0"
description = "Listens for a reference sound cue and sends a short randomized key sequence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "customtkinter>=6.0.0",
  "numpy>=1.26,<3",
  "pillow>=10",
  "soundcard>=0.4,<1",
]

[project.scripts]
starkist = "starkist.cli:main"

[project.gui-scripts]
starkist-gui = "starkist.gui:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starkist"]

[tool.ruff]
line-length = 100
target-version = "py312"
